# Make mouse useful in copy mode
set -g mouse on

# Left-click drag selects in copy mode, release copies to system clipboard
# macOS uses pbcopy instead of xclip
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Scroll History
set -g history-limit 30000

# Set ability to capture on start and restore on exit window data when running an application
set -g alternate-screen on

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
set -s escape-time 50

# ------------------------------------------
# Pane borders — heavy lines, Hyprland-esque
# ------------------------------------------
set -g pane-border-lines heavy
set -g pane-active-border-style 'fg=#e41951,bg=#1c153d'
set -g pane-border-style 'fg=#2a2a4a,bg=#1c153d'

# Enable 2-line status bar
set -g status 2

# Enable truecolor
set -ga terminal-overrides ',*:Tc'

# ------------------------------------------
# Line 0: Padding — spacer between pane content and status bar
# ------------------------------------------
set -g 'status-format[0]' '#[bg=#1c153d,fill=#1c153d] '


# ------------------------------------------
# Line 1: The Red Status Bar
# ------------------------------------------
# Set the background color and empty space fill to the requested red
set -g 'status-format[1]' '#[bg=#e41951,fill=#e41951]'

# Left side: Focused pane indicator + Hostname
set -ag 'status-format[1]' '#[align=left]#[bg=#ffffff,fg=#e41951,bold] #P:#{pane_current_command} #[bg=#e41951,fg=#ffffff] #(whoami)@#H '

# Right side: Date (White text on Red) and Clock (White background, Red bold text)
set -ag 'status-format[1]' '#[align=right]#[bg=#e41951,fg=#ffffff] %a, %b %d #[bg=#ffffff,fg=#e41951,bold] %H:%M:%S '
